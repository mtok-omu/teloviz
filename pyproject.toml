[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "teloviz"
version = "0.1.0"
description = "Ideogram-style visualization of tidk telomere-repeat windows for assembly QC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    # matplotlib renders PDF/PNG/SVG natively and fully headless (Agg backend) —
    # no browser or external binary, unlike plotly's static export (kaleido/Chrome).
    "matplotlib>=3.6",
    "natsort>=8",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
teloviz = "teloviz.cli:main"

[tool.setuptools.packages.find]
include = ["teloviz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
