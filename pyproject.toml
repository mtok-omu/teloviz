[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "teloviz"
version = "0.1.0"
description = "Telomere repeat detection and visualization along genome sequences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "biopython>=1.80",
    "pandas>=1.5",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
teloviz = "teloviz.cli:main"

[tool.setuptools.packages.find]
include = ["teloviz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
